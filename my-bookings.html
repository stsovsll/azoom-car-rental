<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings – AZoom Car Rental</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try {
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("azoom_theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      );
    } catch (e) {}
  </script>
</head>
<body data-page="my-bookings">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-banner">
      <div class="container flex flex-wrap between">
        <div>
          <h1>My bookings</h1>
          <p id="welcome"></p>
        </div>
        <a class="btn btn-light" href="booking.html?new=1"><span data-icon="plus"></span> New booking</a>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div id="payment-alerts"></div>

        <div class="dash-tabs" role="tablist" aria-label="Booking lists" id="tabs">
          <button class="dash-tab" role="tab" id="tab-upcoming" aria-controls="booking-panel" data-tab="upcoming">Upcoming <span class="count"></span></button>
          <button class="dash-tab" role="tab" id="tab-active" aria-controls="booking-panel" data-tab="active">Active <span class="count"></span></button>
          <button class="dash-tab" role="tab" id="tab-past" aria-controls="booking-panel" data-tab="past">Past <span class="count"></span></button>
        </div>
        <div id="booking-panel" role="tabpanel" tabindex="0" class="stack"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/core.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/my-bookings.js"></script>
</body>
</html>
